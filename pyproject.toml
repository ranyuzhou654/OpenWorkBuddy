[project]
name = "nano-workbuddy"
version = "0.1.0"
description = "A small, complete personal agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.8,<3",
    "pydantic>=2.12,<3",
    "keyring>=25",
    "fastapi>=0.120,<1",
    "uvicorn>=0.38,<1",
    "anthropic>=2.1,<3",
    "tomlkit>=0.13,<1",
]

[project.scripts]
nwb = "nano_workbuddy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.2", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nano_workbuddy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
